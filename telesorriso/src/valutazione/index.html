<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scopri se è adatto a te — Telesorriso</title>
  <meta name="description" content="Rispondi a 3 domande e richiedi le 2 valutazioni iniziali senza costo per l’ortodonzia trasparente. Nessun impegno.">
  <meta name="robots" content="noindex, follow">
  <!-- @include head -->
  <meta property="og:title" content="Scopri se l’ortodonzia trasparente è adatta a te | Telesorriso">
  <meta property="og:description" content="3 domande, circa 60 secondi, nessun impegno.">
  <link rel="modulepreload" href="/js/site.mjs">
</head>
<body>
  <div class="quiz-page">
    <header class="quiz-header">
      <div class="wrap">
        <button type="button" class="back-btn" id="back" hidden>
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Indietro</span>
        </button>
        <a class="logo" href="/" data-funnel-link aria-label="Telesorriso — pagina iniziale">
          <img src="/img/logo.png" alt="Telesorriso" width="233" height="87">
        </a>
        <span></span>
      </div>
    </header>

    <main class="quiz-main">
      <div class="wrap">
        <div class="progress" id="progress" hidden>
          <p class="progress-label" id="progress-label" aria-hidden="true"></p>
          <div class="progress-track" role="progressbar" aria-label="Avanzamento del questionario" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>

        <div id="quiz">
          <noscript>
            <p class="alert">Per compilare il questionario è necessario attivare JavaScript nel browser.</p>
          </noscript>
        </div>
      </div>
    </main>
  </div>

  <!-- MODULO CONTATTI ------------------------------------------------------ -->
  <template id="form-template">
    <div class="step">
      <h1 tabindex="-1">Ci siamo quasi.</h1>
      <p class="lead-text">Lasciaci i tuoi contatti per richiedere le 2 valutazioni iniziali senza costo e ricevere tutte le informazioni sul percorso.</p>

      <form class="form" novalidate>
        <div class="field">
          <label for="f-name">Nome e cognome <span class="req" aria-hidden="true">*</span></label>
          <input id="f-name" name="name" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" maxlength="100" required aria-required="true" aria-describedby="err-name">
          <p class="field-error" id="err-name"></p>
        </div>

        <div class="field">
          <label for="f-phone">Telefono <span class="req" aria-hidden="true">*</span></label>
          <input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="next" maxlength="20" placeholder="333 123 4567" required aria-required="true" aria-describedby="err-phone">
          <p class="field-error" id="err-phone"></p>
        </div>

        <div class="field">
          <label for="f-email">Email <span class="req" aria-hidden="true">*</span></label>
          <input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" enterkeyhint="done" maxlength="254" required aria-required="true" aria-describedby="err-email">
          <p class="field-error" id="err-email"></p>
        </div>

        <!-- Honeypot anti-spam: invisibile alle persone, lasciato vuoto. -->
        <div class="hp" aria-hidden="true">
          <label for="f-website">Lascia vuoto questo campo</label>
          <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="consent-box">
          <div class="check-field">
            <input id="f-privacy" name="privacy" type="checkbox" required aria-required="true" aria-describedby="err-privacy">
            <label for="f-privacy">Ho letto l’<a href="/privacy/" target="_blank" rel="noopener">informativa privacy</a> e chiedo di essere ricontattato per ricevere informazioni e fissare le valutazioni. <span class="req" aria-hidden="true">*</span> <span class="ph">[TESTO DA VALIDARE]</span></label>
            <p class="field-error" id="err-privacy"></p>
          </div>
          <div class="check-field">
            <input id="f-marketing" name="marketing" type="checkbox">
            <label for="f-marketing">Facoltativo: acconsento a ricevere comunicazioni promozionali da Telesorriso. <span class="ph">[TESTO DA VALIDARE]</span></label>
          </div>
        </div>

        <p class="alert" id="form-alert" role="alert" tabindex="-1"></p>

        <button type="submit" class="btn btn-block">
          <span class="btn-label">Richiedi le 2 valutazioni senza costo</span>
        </button>
        <p class="cta-note">Nessun pagamento online · Nessun impegno</p>
      </form>
    </div>
  </template>

  <!-- CONFERMA ------------------------------------------------------------- -->
  <template id="thanks-template">
    <div class="step thanks">
      <div class="thanks-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 36 36"><path d="M9 18.5l6 6L27 12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 tabindex="-1">Richiesta ricevuta ✓</h1>
      <p>Grazie. Abbiamo ricevuto la tua richiesta.</p>
      <p>Verrai contattato telefonicamente per ricevere tutte le informazioni sul percorso e, se lo desideri, fissare la prima delle due valutazioni iniziali senza costo.</p>
      <p class="phone-tip">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="currentColor"/></svg>
        Tieni il telefono a portata di mano.
      </p>
    </div>
  </template>

  <!-- @include footer -->

  <script type="module" src="/js/quiz.mjs"></script>
</body>
</html>
